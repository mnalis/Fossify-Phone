name: Build signed release apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 17
          distribution: "temurin"

      - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

      # Decode keystore from secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Clean project
        run: ./gradlew clean

      - name: Set nightly version
        id: nightly
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          SHORT_SHA=${HEAD_SHA::7}
          NIGHTLY_VERSION="${VERSION_NAME}-nightly-${SHORT_SHA}"
          echo "nightly_version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          ./gradlew \
            -PVERSION_NAME="${{ steps.nightly.outputs.nightly_version }}" \
            assembleFossRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: foss-release-signed
          path: app/build/outputs/apk/foss/release/*release.apk
